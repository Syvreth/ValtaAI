heavy_host = "http://127.0.0.1:11434"
self_host = "http://127.0.0.1:11435"

teacher_model = "hf.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M"
self_model = "qwen2.5-coder:3b"
embed_model = "nomic-embed-text"
hf_base = "Qwen/Qwen2.5-Coder-3B-Instruct"

teacher_num_ctx = 32768
self_num_ctx = 32768

research_interval_sec = 300
research_page_cap = 3
train_threshold = 8

chunk_chars = 3200
chunk_overlap = 400
top_k = 5
work_max_steps = 8
repair_rounds = 2

extra_models = []

# Longest training example in tokens; longer ones are skipped. Memory grows with this, mostly in the output
# layer (about 150,000 token scores per position). On the 6 GB GTX 1660, 1024 filled the card and spilled into
# system RAM (about 58 s per step); 768 keeps 98% of a typical dataset. If training still crawls, try 640.
train_max_len = 768
# Save training progress every this many steps (one step is four examples). A stopped run continues
# from the last save with `valta train --resume`. At about a minute per step on the GTX 1660, 25 loses
# at most about 25 minutes. 0 turns saving off.
checkpoint_steps = 25
# How far a new fine-tune may score below the current model on the coding eval and still be promoted (0.1 = 10%).
# 0 means it must match or beat the current score. With 12 eval tasks, 0.1 lets a model that lost a task through.
eval_tolerance = 0.0

# Most conversations from imported datasets (`valta dataset import`) mixed into one fine-tune.
# Keeps a large public dataset from drowning out your corrections and verified work. 0 leaves them out.
external_max_pairs = 2000

# Passages from ingested books and learned web pages (`valta learn`) that the teacher turns into one
# question and answer each when training starts. Each is one teacher call, about half a minute.
doc_qa_pairs = 20

# Terminal colors. Any Textual theme: tokyo-night, nord, gruvbox, dracula, catppuccin-mocha, textual-dark, textual-light...
ui_theme = "tokyo-night"
