[project]
name = "valta"
version = "0.1.0"
description = "A local companion that keeps memory, researches, and fine-tunes."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "chromadb>=0.5",
  "pypdf>=5",
  "ebooklib>=0.18",
  "ddgs>=9",
  "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
  "torch",
  "transformers>=4.46",
  "peft>=0.13",
  "trl>=0.12",
  "bitsandbytes>=0.44",
  "accelerate>=1.0",
  "datasets>=3",
]
# `valta eval --plus`. EvalPlus brings its own transformers, datasets and API clients, so it goes in its own
# venv (.venv-eval), away from the training packages. The 0.3.1 release can never pass HumanEval/32; this
# commit fixes that. Its build needs SETUPTOOLS_SCM_PRETEND_VERSION set, since the archive has no git history.
eval = ["evalplus @ https://github.com/evalplus/evalplus/archive/26d6d00bb1fd0fa37f39c99d5290da67891d1c5e.zip"]

[project.scripts]
valta = "valta.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["valta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
