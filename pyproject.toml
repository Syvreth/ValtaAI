[project]
name = "valta"
version = "0.1.0"
description = "A local companion that keeps memory, researches, and fine-tunes."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "chromadb>=0.5",
  "pypdf>=5",
  "ebooklib>=0.18",
  "ddgs>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
  "torch",
  "transformers>=4.46",
  "peft>=0.13",
  "trl>=0.12",
  "bitsandbytes>=0.44",
  "accelerate>=1.0",
  "datasets>=3",
]

[project.scripts]
valta = "valta.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["valta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
